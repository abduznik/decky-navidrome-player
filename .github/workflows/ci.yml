name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Show runner architecture
        run: |
          uname -m
          python3 -c 'import platform; print(platform.machine())'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build frontend
        run: pnpm build

      - name: Backend tests
        run: python3 -m unittest discover -s tests -v

      - name: Verify the plugin is architecture independent
        run: |
          if find dist py_modules -type f \( -name '*.so' -o -name '*.node' -o -name '*.dylib' -o -name '*.dll' \) | grep -q .; then
            echo "Found a native binary; this plugin must stay arch-independent." >&2
            exit 1
          fi

      - name: Package plugin
        run: ./scripts/package.sh "${{ matrix.arch }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: navidrome-player-${{ matrix.arch }}
          path: out/*.zip
          if-no-files-found: error
