name: Bug report
description: Something is broken or behaves unexpectedly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include the plugin version, device and
        relevant Decky logs. Do not paste your Navidrome password.
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: Shown in Decky next to Navidrome Player, or in package.json.
      placeholder: "0.1.2"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and architecture
      description: For example "Retroid Pocket Nova, arm64" or "Steam Deck OLED, x86_64".
      placeholder: "Retroid Pocket Nova (arm64)"
    validations:
      required: true
  - type: input
    id: decky
    attributes:
      label: Decky Loader version
      placeholder: "3.x.x"
  - type: input
    id: navidrome
    attributes:
      label: Navidrome version
      placeholder: "0.5x.x"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open QAM -> Decky -> Navidrome Player
        2. Go to Library -> Albums
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: |
        Relevant lines from ~/homebrew/logs/navidrome-player/plugin.log.
        Remove server URLs, usernames and any credentials first.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I am on the latest release.
          required: true
        - label: I removed credentials and personal information from logs.
          required: true
