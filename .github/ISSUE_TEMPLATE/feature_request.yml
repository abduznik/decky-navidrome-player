name: Feature request
description: Suggest a new capability or UX improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the proposed solution. Controller-first
        behavior and arm64 compatibility are hard requirements for this plugin.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: "I want to ... because ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: device
    attributes:
      label: Device / architecture
      placeholder: "Retroid Pocket Nova (arm64)"
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: This feature can be operated with a controller.
          required: true
        - label: This feature does not require a native binary or an architecture-specific dependency.
          required: true
